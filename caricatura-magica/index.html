<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Caricatura Mágica</title><link rel="stylesheet" href="./css/app.css"></head>
<body><header><a href="../" class="back">← Juegos</a><h1>✨ Caricatura Mágica ✨</h1><p>Sube tu personaje y dale vida.</p></header><main><section class="card"><div class="stage"><div id="empty" class="empty"><b>🖼️</b><strong>Tu personaje aparecerá aquí</strong></div><img id="character" hidden alt="Personaje cargado"></div></section><aside class="card"><h2>🎨 Mi personaje</h2><label class="upload" for="file">📷 Elegir imagen<br><small>PNG, JPG o WEBP</small></label><input id="file" type="file" accept="image/png,image/jpeg,image/webp"><div class="moves"><button data-move="jump">⬆️ Saltar</button><button data-move="dance">🎵 Bailar</button><button data-move="hello">👋 Saludar</button><button data-move="spin">🌀 Girar</button><button data-move="bounce">💫 Magia</button><button id="random">🎲 Sorpresa</button></div><p class="tip">💡 Funciona mejor con una caricatura de cuerpo completo.</p></aside></main><script type="module" src="./js/app.js"></script></body></html>
